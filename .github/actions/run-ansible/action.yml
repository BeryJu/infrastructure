name: 'Run ansible-playbook'
description: 'Run an ansible playbook'
inputs:
  playbook:
    description: 'The playbook'
    required: true

runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@v10.3.3
    - uses: actions/setup-python@v7
      with:
        python-version-file: 'pyproject.toml'
    - uses: actions/cache@v6
      with:
        path: /home/runner/.ansible
        key: ${{ runner.os }}-ansible-${{ hashFiles('collections/requirements.yml') }}
    - name: prepare
      shell: bash
      run: |
        uv sync
        # Ensure jq is installed
        sudo apt update
        sudo apt install -y jq openssh-client
        # Install collections/roles
        uv run ansible-galaxy collection install -r collections/requirements.yml --force
        uv run ansible-galaxy role install -r collections/requirements.yml --force
    - name: Get Vault token
      id: vault
      shell: bash
      run: |
        # GitHub's JWT expires within minutes, so exchange it for a Vault token up front
        JWT=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
        TOKEN=$(curl -sf -X POST -d "{\"role\":\"github-terraform\",\"jwt\":\"${JWT}\"}" https://vault.beryju.io/v1/auth/github-actions/login | jq -r .auth.client_token)
        echo "::add-mask::${TOKEN}"
        echo "token=${TOKEN}" >> $GITHUB_OUTPUT
    - name: run job
      shell: bash
      env:
        ANSIBLE_REMOTE_USER: ansible
        ANSIBLE_PRIVATE_KEY_FILE: ./ansible.key
        ANSIBLE_HOST_KEY_CHECKING: "false"
        ANSIBLE_HASHI_VAULT_ADDR: https://vault.beryju.io
        ANSIBLE_HASHI_VAULT_AUTH_METHOD: token
        ANSIBLE_HASHI_VAULT_TOKEN: ${{ steps.vault.outputs.token }}
        ARA_API_CLIENT: http
        ARA_API_SERVER: "https://ara.beryjuio-home.k8s.beryju.io"
        ANSIBLE_FORCE_COLOR: "true"
      run: |
        export ANSIBLE_CALLBACK_PLUGINS=$(uv run python3 -m ara.setup.callback_plugins)
        uv run ansible-playbook -v ${{ inputs.playbook }}
